# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the OS, Python version, and other tools you might need
build:
  os: ubuntu-24.04
  tools:
    python: "3.14"
  jobs:
    post_create_environment:
      - pip install uv
    post_install:
      # Docs-only environment: Sphinx/AutoAPI parse the sources statically, so the
      # workspace packages are never imported here. Installing the default dev group
      # (and its Rust/PyO3 members) consumed ~485s of the 900s community build budget,
      # timing the build out before RTD could upload the artifact.
      - . $READTHEDOCS_VIRTUALENV_PATH/bin/activate && uv sync --only-group docs --no-install-project --index https://pypi.org/simple --active --inexact


      # Build documentation in the "docs/" directory with Sphinx
sphinx:
  configuration: docs/source/conf.py
