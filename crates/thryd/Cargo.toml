[package]
name = "thryd"
version = "0.7.3"
edition = "2024"
description = "A light weight, embeded llm request router, with cache."
authors.workspace = true
license-file.workspace = true
repository.workspace = true

[dependencies]
async-openai = { version = "0.41.3", features = ["completions", "embedding-types"] }
async-trait = "0.1.92"
cached = { version = "2.0.2", features = ["proc_macro"] }
eventsource-stream = "0.2.3"
futures = "0.3.34"
http = "1.5.0"
moka = { version = "0.12.16", features = ["sync"] }
once_cell = "1.21.4"
reqwest = { version = "0.13.4", features = ["json", "rustls", "stream"] }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
strum = { version = "0.28.0", features = ["derive"] }
strum_macros = "0.28.0"
thiserror = "2.0.20"
tiktoken-rs = "0.12.0"
tokio = "1.53.1"
tracing = "0.1.44"
url = { version = "2.5.8", features = ["serde"] }


pyo3 = { version = "0.29.2", optional = true }
pyo3-stub-gen = { version = "0.23.0", optional = true }
heed = "0.22.1"
postcard = { version = "1.1.3", features = ["use-std"] }
blake3 = "1.8.7"
dashmap = "6.2.1"
infer = "0.22"
base64 = "0.23"



[features]
pyo3 = ["dep:pyo3"]
stubgen = ["dep:pyo3-stub-gen"]


[dev-dependencies]
tempfile = "3"
