[package]
name = "mcp-manager"
version = "0.1.6"
edition = "2024"

[dependencies]
futures = "0.3.34"
rmcp = { version = "3.1.4", features = ["client", "reqwest", "transport-child-process", "transport-io", "transport-streamable-http-client-reqwest"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["process", "rt-multi-thread", "sync"] }
which = "8.0.5"

thiserror = "2.0.20"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["test-util"] }


