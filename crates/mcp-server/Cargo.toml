[package]
name = "mcp-server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.4"
futures = "0.3.34"
rmcp = { version = "3.1.4", features = ["server", "transport-io", "transport-streamable-http-server"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "sync", "io-util", "io-std"] }
tracing = "0.1.41"

[dev-dependencies]
rmcp = { version = "3.1.4", features = ["client", "transport-streamable-http-client-reqwest", "transport-io"] }
tokio = { version = "1.53.1", features = ["test-util"] }
