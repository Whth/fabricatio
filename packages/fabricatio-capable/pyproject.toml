[project]
name = "fabricatio-capable"
version = "0.1.6"
description = "Capability-assessment mixin for Fabricatio agents: decides whether a request is fulfillable with available tools and context."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Whth", email = "zettainspector@foxmail.com" }
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Typing :: Typed",
]

requires-python = ">=3.12,<3.15"

dependencies = [
    "fabricatio-core",
    "fabricatio-tool",
    "fabricatio-judge",
]

[dependency-groups]
dev = [
    "fabricatio-mock",
    "pytest",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
sources = ["python"]

[tool.uv.sources]
fabricatio-mock = { workspace = true }

[project.urls]
Homepage = "https://github.com/Whth/fabricatio"
Repository = "https://github.com/Whth/fabricatio"
Issues = "https://github.com/Whth/fabricatio/issues"
