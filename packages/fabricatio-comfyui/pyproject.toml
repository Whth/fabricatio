[project]
name = "fabricatio-comfyui"
version = "0.8.2"
description = "Async ComfyUI API integration for Fabricatio: generate images from typed knobs and download the results."
readme = "README.md"
license = "MIT"
authors = [
    { name = "UNK", email = "example@mail.com" }
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Typing :: Typed",
]

requires-python = ">=3.12,< 3.15"

dependencies = [
    "fabricatio-core",
    "httpx>=0.28.0",
    "pillow>=11.0",
]

[dependency-groups]
dev = [
    "pytest",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
sources = ["python"]

[project.urls]
Homepage = "https://github.com/Whth/fabricatio"
Repository = "https://github.com/Whth/fabricatio"
Issues = "https://github.com/Whth/fabricatio/issues"
