[package]
name = "fabricatio-lancedb"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29.2" }
serde = { version = "1.0.229", features = ["derive"] }

pyo3-async-runtimes = { version = "0.29.0", features = ["tokio-runtime"] }
fabricatio-logger = { workspace = true }
error-mapping = { workspace = true, features = [
    "strum", "lancedb", "serde_json", "pythonize",
    "pyo3_cast", "arrow-schema", "thryd"
] }
pyo3-stub-gen = "0.23.0"
strum = { version = "0.28.0", features = ["derive"] }
lancedb = { version = "0.37.1", default-features = false }
pythonize = "0.29.0"
uuid = { version = "1.24.1", features = ["v7"] }
cached = "2.0.2"
serde_json = { version = "1.0.151", default-features = false }
# Must match the arrow version lancedb vendors internally (re-exported via lancedb::arrow) — bump together.
arrow-array = { version = "58.3.0", default-features = false }
tokio = { version = "1.53.1", default-features = false }
rayon = { version = "1.12.0", default-features = false }
futures-util = { version = "0.3.34", default-features = false }
thryd = { path = "../../crates/thryd" }



[features]
default = ["pyo3/extension-module"]
stubgen = []

[dev-dependencies]
criterion = "0.8.2"


[[bench]]
name = "schema_bench"
harness = false
