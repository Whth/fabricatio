[package]
name = "fabricatio-memory"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
chrono = "0.4.45"
tantivy = { version = "0.27.0", features = ["mmap"] }
pyo3 = { version = "0.30.1" }
serde = { version = "1.0.229", features = ["derive"] }
once_cell = "1.21.4"
pythonize = "0.30.0"
pyo3-stub-gen = { version = "0.23.2", optional = true }
error-mapping = { path = "../../crates/error-mapping", features = ["tantivy", "serde_json"] }
uuid = { version = "1.29.2", features = ["v7"] }
moka = { version = "0.12.16", features = ["sync"] }
sanitize-filename = "0.6.0"
fabricatio-logger = { path = "../../crates/fabricatio-logger" }

rayon = "1.12.0"
serde_json = "1.0.154"


[features]
default = ["pyo3/extension-module"]
stubgen = ["dep:pyo3-stub-gen"]
